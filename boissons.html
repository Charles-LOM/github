<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boissons souhaitées — Projet 06.02</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script>
</head>

<body data-role="technicien" data-page="drinks">
  <header>
    <a class="logo" href="index.html">Projet 06.02</a>
    <span class="user-label" id="user-label"></span>
    <a class="logout-link" href="#" id="logout-link">Déconnexion</a>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <h2>Mon espace</h2>
      <nav id="sidebar-nav"></nav>
    </aside>

    <main class="app-content">
      <h1 class="page-title">Boissons souhaitées</h1>
      <p class="muted">Ajoute les boissons à prendre en compte pour le projet.</p>

      <form id="drink-form" class="form">
        <label for="drink-name">Nom de la boisson</label>
        <input id="drink-name" required>
        <button type="submit">Ajouter la boisson</button>
      </form>

      <div id="drink-list" class="list"></div>
    </main>
  </div>
</body>
</html>
